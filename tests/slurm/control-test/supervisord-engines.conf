; supervisord of devai-control-test-engines (root). devai-control writes the
; fake engine's program into /run/devai/supervisor and adds it.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:devai-control]
command=/usr/local/bin/devai-control --container engines --config /etc/devai/control.yaml
autorestart=true
startsecs=1
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[include]
files = /run/devai/supervisor/*.conf
