# Model families tracked by DevAI.
#
# This file is the ONLY hand-maintained source of model information. All
# sizes, architectures, and per-variant metadata are fetched live from
# upstream providers (HuggingFace Hub API, Ollama registry) by
# scripts/generate-catalog.py, which writes deploy/models.yaml.
#
# Each family may specify:
#   ollama_repos    – list of library names under ollama.com/library/<name>;
#                     every published tag for each library becomes a catalog
#                     row served by the ollama backend
#   hf_repos        – list of HuggingFace repositories (transformers
#                     safetensors / FP8 / NVFP4 / AWQ / GPTQ); each becomes
#                     one catalog row served by vllm/sglang backends
#   gguf_repos      – list of HuggingFace GGUF-only repositories. Each
#                     entry can carry an optional `include:` allowlist of
#                     quantization tokens (substring-matched against the
#                     filename, case-insensitive) and an optional
#                     `tag_prefix:` that anchors the local Ollama tag.
#                     Example: filename Qwen3.5-27B-UD-Q3_K_XL.gguf with
#                     tag_prefix=27b becomes ollama tag
#                     qwen3.5:27b-ud-q3_k_xl. Wired by the gguf source
#                     kind (commit 2 of the simplification refactor).
#   arch_ref        – HF repo whose config.json holds the architecture
#                     for variants that don't publish a full config
#                     (primarily Ollama GGUF tags; quantization does not
#                     change architecture, so the base model's config is
#                     the authoritative spec for every tag in the family)
#   thinking        – PRE-PROBE HINT only. Final reasoning capability is
#                     determined per model variant at runtime by
#                     scripts/probe-ollama-reasoning.py and stored in
#                     the probe cache as `reasoning.capability`.
#                     This flag is informational; the picker and router
#                     ignore it and use the probe result instead.
#   parsers         – CURATED HINT for vLLM/SGLang only. Names the backend
#                     server-startup parser flags this family expects to
#                     work with. The probe drivers launch with these flags
#                     set and verify them in a single round-trip; the
#                     router reads the probe-confirmed values back from the
#                     cache. Shape:
#                       parsers:
#                         vllm:
#                           reasoning: <vllm --reasoning-parser value>
#                           tool: <vllm --tool-call-parser value>
#                         sglang:
#                           reasoning: <sglang --reasoning-parser value>
#                           tool: <sglang --tool-call-parser value>
#                     All four sub-fields are optional. A family without a
#                     `parsers:` block probes in inline/no-tool mode (no
#                     parser flags emitted; same behavior as today). Only
#                     applies to hf_repos / NVFP4 / safetensors variants —
#                     Ollama handles reasoning and tool-calling natively.
#   defaults        – advisory default tags per backend (optional)
#
# YAML formatting rule: every list element on its own line. Do NOT use
# inline brackets `[a, b]` or inline maps `{key: val}`.
#
# To add a family: add a block below, then run `make catalog-regen`.
#
# ── SGLang NVFP4 status (verified 2026-05-01) ────────────────────────────
# Image `lmsysorg/sglang:v0.5.10.post1-cu130` cannot serve any NVFP4
# checkpoint. Every probe of an NVFP4 repo (Qwen3*, Llama-3.1-NVFP4,
# Nemotron-Nano-NVFP4, Gemma-NVFP4) fails at
#   /sgl-workspace/sglang/python/sglang/srt/layers/quantization/modelopt_quant.py:1482
#   in fp4_quantize(x, layer.input_scale_inv)
# vLLM at the same NVFP4 weights loads fine — this is a SGLang-side bug,
# probably a missing kernel for the cu130 / Blackwell path. Workaround
# until upstream fixes it: route NVFP4 traffic to vLLM only. The probe
# cache records `kind=infra` for every SGLang/NVFP4 cell so the picker
# auto-hides them; no per-family workaround needed below.
# Tracking: file an issue at https://github.com/sgl-project/sglang/issues
# referencing the modelopt_quant trace if not already reported.

families:
  - name: gemma4
    ollama_repos:
      - gemma4
    hf_repos:
      - google/gemma-4-e2b-it
      - google/gemma-4-e4b-it
      - google/gemma-4-26b-a4b-it
      - google/gemma-4-31b-it
      - nvidia/Gemma-4-31B-IT-NVFP4
      - bg-digitalservices/Gemma-4-26B-A4B-it-NVFP4
    gguf_repos:
      # Registry's gemma4:31b at Q4_K_M needs ~46G — doesn't fit on a
      # 24G card. Unsloth's Dynamic 2.0 Q3 variants drop weights to
      # ~14-17G so the 31B becomes reachable on consumer hardware.
      - repo: unsloth/gemma-4-31B-it-GGUF
        tag_prefix: 31b
        include:
          - UD-Q3_K_XL
          - UD-IQ3_XXS
      - repo: unsloth/gemma-4-26B-A4B-it-GGUF
        tag_prefix: 26b-a4b
        include:
          - UD-Q3_K_XL
    arch_ref: google/gemma-4-26b-a4b-it
    thinking: true        # hint; runtime probe shows e2b/e4b are unsupported

  - name: qwen3.5
    ollama_repos:
      - qwen3.5
    hf_repos:
      - ykarout/Qwen3.5-9B-NVFP4
      - apolo13x/Qwen3.5-27B-NVFP4
      - apolo13x/Qwen3.5-35B-A3B-NVFP4
    parsers:
      vllm:
        reasoning: qwen3
        # Qwen3.5 chat template emits XML-shape tool calls
        # (`<tool_call><function=...><parameter=key>value</parameter></function></tool_call>`),
        # not plain hermes (`<tool_call>{json}</tool_call>`). Probe
        # confirmed `hermes` left tool_calls empty on Qwen3.5-9B-NVFP4
        # while it worked on Qwen3-8B-NVFP4. Verified via
        # tokenizer_config.json chat_template inspection 2026-05-01.
        tool: qwen3_xml
      sglang:
        reasoning: qwen3
        # SGLang has no qwen3_xml parser — `qwen` covers the same
        # XML-shape via the Qwen25 detector. NVFP4 weights fail at
        # SGLang's modelopt_quant in v0.5.10.post1-cu130 anyway, so
        # this parser never gets exercised on the NVFP4 variants
        # currently in this family. Re-evaluate when SGLang ships
        # an NVFP4-capable image.
        tool: qwen
    gguf_repos:
      # 27B dense — Q4_K_M from registry spills hard at 24G; sub-Q4
      # Unsloth quants fit. UD-Q3_K_XL is the recommended sweet spot;
      # Q3_K_M / UD-IQ3_XXS give 1-2 GB more headroom for KV.
      - repo: unsloth/Qwen3.5-27B-GGUF
        tag_prefix: 27b
        include:
          - UD-Q3_K_XL
          - UD-IQ3_XXS
          - Q3_K_M
      # 35B-A3B MoE — not in the Ollama registry. Sub-Q4 quants put
      # this in reach on a 24G card (only ~3B active params per token,
      # so it loads like a 3B for compute but with 35B knowledge).
      - repo: unsloth/Qwen3.5-35B-A3B-GGUF
        tag_prefix: 35b-a3b
        include:
          - UD-Q3_K_XL
          - UD-IQ3_XXS
          - Q3_K_M
    arch_ref: ykarout/Qwen3.5-9B-NVFP4
    thinking: true

  - name: qwen3
    # Same model on both backends so the picker can show side-by-side
    # rows for benchmarking. The tag filter in generate-catalog.py
    # drops bare aliases (`:8b`, `:14b`) and routing variants
    # (`:30b-instruct`, `:235b-thinking`) so only quantization-bearing
    # tags reach the catalog.
    ollama_repos:
      - qwen3
    hf_repos:
      # Dense — pick one (or more) that fits your VRAM band. NVFP4 weights:
      #   8B  → ~6 GB    (fast iteration, fits everywhere)
      #   14B → ~8 GB    (sweet spot on 24G)
      #   32B → ~19 GB   (largest dense that fits 24G with KV)
      - nvidia/Qwen3-8B-NVFP4
      - nvidia/Qwen3-14B-NVFP4
      - nvidia/Qwen3-32B-NVFP4
      # MoE — 30B total, 3B active per token. Loads like a 30B (~17 GB
      # NVFP4) but compute-light. Distinct from the qwen3.5 family's
      # 35B-A3B variants which have a different tokenizer.
      - nvidia/Qwen3-30B-A3B-NVFP4
    parsers:
      vllm:
        reasoning: qwen3
        tool: hermes
      sglang:
        reasoning: qwen3
        tool: qwen
    arch_ref: nvidia/Qwen3-14B-NVFP4
    thinking: true

  - name: qwen3-coder
    # Agentic-coding fine-tune of Qwen3-30B-A3B (30.5B total / 3.3B
    # active MoE). Native 256K context, extends to 1M with YaRN.
    # Non-thinking only — model card explicitly states it does not
    # generate <think></think> blocks, so no reasoning parser is set.
    # Tool calls follow the Qwen3-Coder format which both vLLM and
    # SGLang register as `qwen3_coder` (same name on both, unlike the
    # nemotron split). On-disk weights ~18 GB; same VRAM envelope as
    # the base nvidia/Qwen3-30B-A3B-NVFP4 above.
    hf_repos:
      - NVFP4/Qwen3-Coder-30B-A3B-Instruct-FP4
    parsers:
      vllm:
        tool: qwen3_coder
      sglang:
        tool: qwen3_coder
    arch_ref: NVFP4/Qwen3-Coder-30B-A3B-Instruct-FP4
    thinking: false

  # NOTE: NVFP4/Qwen3-30B-A3B-Thinking-2507-FP4 was added 2026-05-02
  # and removed the same day. The checkpoint OOMs at vLLM model-load
  # time on 24G consumer GPUs — verified on RTX 4000 Pro Blackwell
  # with the full mitigation matrix (--enforce-eager,
  # --kv-cache-dtype fp8, --max-num-seqs 4, --gpu-memory-utilization
  # 0.95). PyTorch reaches 22.74 GiB allocated and fails on a 768 MiB
  # final tensor before reaching the memory-profiling stage where any
  # of those flags would have effect, so no engine_flags knob can
  # rescue it. Root cause: this checkpoint's config.json carries
  # intermediate_size=6144 vs Coder/base Qwen3-30B-A3B's 5472, which
  # inflates vLLM's load-time scratch buffers by ~700 MiB beyond the
  # 24G ceiling. Re-add when:
  #   * vLLM loader stops sizing scratch buffers to intermediate_size
  #     for MoE-only models (issue worth filing upstream), OR
  #   * NVIDIA / RedHatAI publishes a Thinking-2507 NVFP4 quant with
  #     a slimmer load-time profile (e.g. the Coder/Instruct line),
  #     OR
  #   * SGLang fixes its NVFP4 path (bug noted at the top of this
  #     file) so we can fall back to SGLang's loader.

  - name: llama3.2
    # Ollama-only — NVIDIA hasn't published an NVFP4 quant for the
    # Llama-3.2 1B/3B line (too small for the Blackwell tensor-core
    # target). No HF sibling to add for cross-backend comparison.
    ollama_repos:
      - llama3.2
    arch_ref: nvidia/Llama-3.1-8B-Instruct-NVFP4
    thinking: false

  - name: llama3.1
    # Both backends. Ollama's llama3.1 library covers 8B/70B/405B in
    # every k-quant; the HF NVFP4 sibling is the 8B Instruct so picker
    # rows align on size class for side-by-side benchmarking.
    ollama_repos:
      - llama3.1
    hf_repos:
      - nvidia/Llama-3.1-8B-Instruct-NVFP4
    parsers:
      # Llama-3.1 Instruct has no structured-reasoning surface — only
      # tool-calling is curated here. Reasoning probe will fall back to
      # inline/unsupported classification.
      vllm:
        tool: llama3_json
      sglang:
        tool: llama3
    arch_ref: nvidia/Llama-3.1-8B-Instruct-NVFP4
    thinking: false

  - name: nemotron-nano-v2
    hf_repos:
      - nvidia/NVIDIA-Nemotron-Nano-9B-v2-NVFP4
    # Tool parser intentionally not curated. The 9B-v2 chat template uses
    # NVIDIA's custom uppercase `<TOOLCALL>[...]</TOOLCALL>` /
    # `<AVAILABLE_TOOLS>` / `<TOOL_RESPONSE>` format — no shipped vLLM
    # or SGLang parser matches it (all stock parsers expect lowercase
    # `<tool_call>` Hermes-style or family-specific tokens). Without a
    # custom parser, the router strips `tools`/`tool_choice` for this
    # model: agentic tool calls are silently absent, plain chat works.
    arch_ref: nvidia/NVIDIA-Nemotron-Nano-9B-v2-NVFP4
    thinking: true        # hint; vLLM/SGLang variants probed separately later

  # Parser-name verification source: vLLM v0.x (cu130 image) registers
  # reasoning parsers in vllm/reasoning/__init__.py:_REASONING_PARSERS_TO_REGISTER
  # and tool-call parsers in --help under --tool-call-parser choices.
  # SGLang v0.5.10 registers reasoning detectors in
  # python/sglang/srt/parser/reasoning_parser.py and tool detectors in
  # python/sglang/srt/function_call/function_call_parser.py.
  # Drift here breaks container startup — keep names verbatim per backend.

  - name: nemotron-3-nano
    ollama_repos:
      - nemotron-3-nano
    hf_repos:
      # nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4 — text-only sibling
      # of the Omni variant below.
      #
      # History:
      #   2026-05-01: removed after a probe at 24 GB returned
      #     gpu_model_runner.py:4818 OOM during model load (PyTorch
      #     reaches 23.37 GiB on a 23.42 GiB-usable card and fails on a
      #     316 MiB allocation, with 4.25 GiB reserved-but-unallocated).
      #   2026-05-02: tested the original --enforce-eager hypothesis;
      #     FALSIFIED because the OOM trips before CUDA graph capture.
      #   2026-05-02: vLLM's own error message hinted at the fix —
      #     PYTORCH_ALLOC_CONF=expandable_segments:True. Combined with
      #     --enforce-eager + --gpu-memory-utilization 0.92, the model
      #     loads cleanly: VRAM peaks at 23.12/23.89 GiB (96.8 % of card,
      #     ~1.3 GiB headroom at 32K) and round-trips both the reasoning
      #     parser (nemotron_v3) and tool parser (qwen3_coder, NOT hermes
      #     which JSON-decoder-errored on the model's <function=...>
      #     <parameter=...> tool format).
      # Re-added 2026-05-03 with the recovery flags wired into the
      # router's per-model overrides — see modelRecoveryConfig in
      # gpu-arbiter/main.go. The flag list lives there rather than in a
      # catalog field because (a) it's recovery policy not probe-verified
      # data, (b) it's the same on every (vram, ctx) cell, and (c) the
      # probe-cache schema doesn't carry flag-list fields.
      - nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4
      #
      # nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4 (and the
      # matching unsloth GGUF mirror) was previously listed here.
      # Removed 2026-05-03: project focus is coding + reasoning, the
      # Omni variant only adds vision/audio I/O on top of the same
      # reasoning brain, and on a 24G card it would consume both
      # additional disk and the headroom that the text-only variant
      # already sits within. The Ollama side never wired multimodal
      # tokens through `/api/chat` either, so the GGUF mirror was
      # text-only inference of the Omni weights — branding without
      # delivered capability. Re-add only when the project explicitly
      # adds image/audio workflows.
    parsers:
      # Reasoning parser: SGLang ships `nemotron_3`; vLLM has a built-in
      # `nemotron_v3` that the project initially used, but NVIDIA's HF
      # model card for the 30B-A3B variant explicitly prescribes a
      # *different* parser called `nano_v3`, registered via a plugin
      # script (`nano_v3_reasoning_parser.py`) shipped in the model
      # repo. The plugin inherits from `DeepSeekR1ReasoningParser` and
      # adds the `enable_thinking=False` swap for reasoning-disabled
      # turns. The built-in `nemotron_v3` is for the older 9B-v2 line
      # and gives different boundaries on this model -- empirically
      # observed 2026-05-03: under Anthropic-style chat templates
      # (Claude Code) the boundary detection failed and raw
      # `<function=...>` Qwen3-Coder tool tags leaked into `content`.
      # We now vendor `nano_v3_reasoning_parser.py` under
      # `scripts/vllm_plugins/` and resolve it via the plugin registry
      # (`deploy/vllm-plugins.json`); the router auto-emits
      # `--reasoning-parser-plugin <abs> --reasoning-parser nano_v3`.
      # Names DO NOT match across backends -- keep both verbatim.
      # Tool parser: the prior comment claimed `hermes`. That was wrong
      # -- verified empirically 2026-05-02 against the text-only
      # NVFP4 variant: the model emits Qwen3-Coder-style
      # `<function=NAME><parameter=KEY>VALUE</parameter></function>`
      # tags (NOT JSON-in-`<tool_call>` like Hermes), and the hermes
      # parser JSONDecodeError'd on every call. `qwen3_coder` parsed
      # the round-trip cleanly into OpenAI-format tool_calls.
      vllm:
        reasoning: nano_v3
        tool: qwen3_coder
      sglang:
        reasoning: nemotron_3
        tool: qwen3_coder
    arch_ref: nvidia/NVIDIA-Nemotron-Nano-9B-v2-NVFP4
    thinking: true        # hint upgraded after probe verified structured

  - name: nemotron-cascade-2
    # Ollama-only — the only public HF variant (nvidia/Nemotron-Cascade-
    # 2-30B-A3B) is bf16 safetensors at ~60 GB and OOMs on 24G VRAM.
    # Probed 2026-05-01 across vLLM + SGLang × {16G,24G} × {32K..256K};
    # every cell returned oom_startup. NVIDIA hasn't published an
    # NVFP4 / FP8 / quantized variant of Cascade-2. Re-add hf_repos
    # only when a quantized release lands.
    ollama_repos:
      - nemotron-cascade-2
    arch_ref: nvidia/NVIDIA-Nemotron-Nano-9B-v2-NVFP4
    thinking: true        # hint upgraded after probe verified structured

  - name: nemotron
    # Ollama-only — the legacy `nemotron` library hosts the 70B
    # Llama-3-Nemotron variant in k-quants only. NVIDIA's NVFP4 line
    # for that generation never shipped publicly.
    ollama_repos:
      - nemotron
    arch_ref: nvidia/NVIDIA-Nemotron-Nano-9B-v2-NVFP4
    thinking: false       # generic Nemotron, no reasoning per model card

  - name: deepseek-r1-distill
    # Both backends. Ollama's `deepseek-r1` library publishes the
    # full distill matrix (1.5B/7B/8B/14B/32B/70B Qwen + Llama). HF
    # mirrors are the BF16 originals — no NVFP4 distill exists.
    # Tag scheme on Ollama side: `<size>-<base>-distill-<quant>`,
    # e.g., `deepseek-r1:14b-qwen-distill-q4_K_M`.
    ollama_repos:
      - deepseek-r1
    hf_repos:
      # Official DeepSeek R1 distills — BF16 safetensors. NVIDIA hasn't
      # published NVFP4 variants of the distills, and the community
      # quants are unverified. BF16 fits on 24G:
      #   Qwen-7B  → ~14 GB (Qwen2 arch)
      #   Llama-8B → ~15 GB (Llama-3 arch)
      # Both emit R1-style `<think>` blocks; the deepseek-r1 reasoning
      # parser strips them into `reasoning_content`.
      #
      # Tool calling goes through the `deepseek_string` plugin parser
      # (scripts/vllm_plugins/deepseek_string_tool_parser.py, registered
      # in deploy/vllm-plugins.json). The R1-Distill chat templates emit
      # the DeepSeek-V3 boundary markers `<｜tool▁call▁begin｜>` etc.
      # literally, but the distills inherit the BASE model's tokenizer
      # (Qwen2 / Llama3) which lacks those markers as atomic vocab
      # entries. vLLM's built-in `deepseek_v3` / `_v31` / `_v32` parsers
      # all do `vocab.get(<token>)` at startup and crash with HTTP 500:
      # "DeepSeek-V3 Tool parser could not locate tool call start/end
      # tokens in the tokenizer". The `deepseek_string` plugin
      # re-implements the same parser with substring matching instead
      # of vocab-id lookups, so it works on any tokenizer that emits
      # the markers as text — atomic-token or BPE-split.
      # SGLang side stays empty: SGLang's plugin model is Python-import-
      # based (not file-path), and a separate plugin would be needed.
      # Until that lands, SGLang traffic for this family runs without
      # tool support.
      - deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
      - deepseek-ai/DeepSeek-R1-Distill-Llama-8B
    parsers:
      vllm:
        reasoning: deepseek_r1
        tool: deepseek_string
      sglang:
        reasoning: deepseek-r1
    arch_ref: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
    thinking: true

  - name: gpt-oss
    # OpenAI's first open-weight release. The 20B variant ships natively
    # in MXFP4 (~13 GB on disk) — vLLM and SGLang both load it directly.
    # Uses the harmony chat format with explicit reasoning channels.
    hf_repos:
      - openai/gpt-oss-20b
    parsers:
      # Reasoning parser handles the `<|channel|>analysis<|message|>...`
      # harmony reasoning blocks. vLLM registers it under
      # `openai_gptoss`; SGLang registers it under `gpt-oss`.
      # Tool parser: vLLM has dedicated `openai` (handles harmony tool
      # channels); SGLang exposes `gpt-oss` for the same purpose.
      vllm:
        reasoning: openai_gptoss
        tool: openai
      sglang:
        reasoning: gpt-oss
        tool: gpt-oss
    arch_ref: openai/gpt-oss-20b
    thinking: true
