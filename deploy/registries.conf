# Podman registry mirror configuration for devai cache
# Install: cp deploy/cache/registries.conf ~/.config/containers/registries.conf
# Remove:  rm ~/.config/containers/registries.conf
#
# Routes docker.io pulls through local pull-through cache on port 5000.
# Falls back to docker.io directly if the cache is down.

unqualified-search-registries = ["docker.io"]

[[registry]]
prefix = "docker.io"
location = "docker.io"

[[registry.mirror]]
location = "localhost:5000"
insecure = true
