# Podman registry mirror configuration for devai cache
# Install: cp deploy/registries.conf ~/.config/containers/registries.conf
# Remove:  rm ~/.config/containers/registries.conf
#
# Routes docker.io pulls through local pull-through cache on port 5000.
# Falls back to docker.io directly if the cache is down.
#
# SECURITY: `insecure = true` below disables TLS verification for the
# mirror, so EVERY docker.io pull is served over plaintext HTTP from
# whatever answers on localhost:5000 -- an unauthenticated registry with
# no image-signature check. That is acceptable only because the mirror is
# devai-registry-cache on this same host, published on 127.0.0.1 only.
# Do NOT point `location` at a remote host while keeping `insecure = true`,
# and do not install this file on a machine that is not running the local
# cache: a process able to bind localhost:5000 could then serve arbitrary
# images for any docker.io reference you pull.

unqualified-search-registries = ["docker.io"]

[[registry]]
prefix = "docker.io"
location = "docker.io"

[[registry.mirror]]
location = "localhost:5000"
insecure = true
