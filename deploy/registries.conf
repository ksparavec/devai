# Podman registry configuration for devai
# Install: cp deploy/registries.conf ~/.config/containers/registries.conf
# Remove:  rm ~/.config/containers/registries.conf
#
# Resolves unqualified image names against docker.io. Until platform-rebuild
# Phase 2 this file also routed every docker.io pull through a local
# registry:2 mirror on localhost:5000 (plain HTTP, no signature check); the
# mirror is gone, so a host that installed the old file should delete its
# [[registry.mirror]] stanza (INSTALL.md, "Container registry").

unqualified-search-registries = ["docker.io"]

[[registry]]
prefix = "docker.io"
location = "docker.io"
