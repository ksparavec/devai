; supervisord configuration of devai-slurm (docs/slurm.md Sec. 3.1;
; platform-rebuild Phase 5). entrypoint.sh renders the configuration files
; these programs read, then execs supervisord with this file.
;
; Every program logs to supervisord's stdout, which podman keeps. The
; priorities order the start: MariaDB, then slurmdbd, slurmctld, slurmrestd;
; nats-server and the bus log beside them; accounting-init last. slurmd is
; started by node-recover once slurmctld answers, not by supervisord.
; A daemon that exits is started again (autorestart), so a Slurm daemon or
; nats-server that dies comes back without the container restarting
; (docs/slurm.md Sec. 11).

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:mariadb]
priority=10
; --innodb-snapshot-isolation=OFF: 11.8's default makes slurmdbd warn it
; will die on a write conflict (measured, docs/slurm.md Sec. 3.1). The
; init file (re)creates slurmdbd's database user with the current password
; at every start. --no-defaults: Debian's my.cnf is not read, so every
; setting is here and errors go to stderr.
command=/usr/sbin/mariadbd --no-defaults --user=mysql --datadir=/var/cache/devai/jobs/mariadb
    --socket=/run/mysqld/mysqld.sock --pid-file=/run/mysqld/mysqld.pid
    --skip-networking --innodb-snapshot-isolation=OFF --innodb-lock-wait-timeout=900
    --init-file=/run/devai/mariadb-init.sql
autorestart=true
startsecs=5
startretries=100
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:slurmdbd]
priority=20
command=/usr/sbin/slurmdbd -D
autorestart=true
startsecs=5
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:slurmctld]
priority=30
command=/usr/sbin/slurmctld -D
autorestart=true
startsecs=5
startretries=1000
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:node-recover]
priority=35
; One-shot at every container start: jobs slurmctld recovers as running
; died with the previous container; it sets the node DOWN so they end
; NODE_FAIL, then starts slurmd (node-recover.sh). It starts slurmd on every
; path, so it is not restarted.
command=/usr/local/lib/devai/node-recover.sh
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:slurmd]
priority=40
; autostart=false: node-recover starts it (above). Once started, a slurmd
; that exits is started again like every daemon here.
command=/usr/sbin/slurmd -D -N devai
autostart=false
autorestart=true
startsecs=5
startretries=1000
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:slurmrestd]
priority=50
; Its own user: slurmrestd refuses to run as root (I6). SLURM_JWT=daemon:
; it authenticates each request with the client's token, not its own.
command=/usr/sbin/slurmrestd -a rest_auth/jwt -s slurmctld,slurmdbd -d v0.0.42 0.0.0.0:6820
user=slurmrest
environment=SLURM_JWT="daemon"
autorestart=true
startsecs=5
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nats-server]
priority=5
command=/usr/sbin/nats-server -c /run/devai/nats-server.conf
autorestart=true
startsecs=2
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:buslog]
priority=60
; One JSON line per bus event, with its receive time (C4, step 7).
command=/usr/local/bin/devai-bus log --dir /var/cache/devai/jobs/bus
environment=DEVAI_BUS_URL="nats://127.0.0.1:4222",DEVAI_BUS_USER="buslog",DEVAI_BUS_PASSWORD_FILE="/etc/devai/slurm/nats/buslog.pass"
autorestart=true
startsecs=2
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:accounting-init]
priority=70
; One-shot at every container start: waits for slurmdbd, then creates the
; cluster, the account and the user devai (AdminLevel=Operator)
; idempotently. A non-zero exit (the 120 s wait ran out) is logged, and
; restarted, as unexpected.
command=/usr/local/lib/devai/accounting-init.sh
autorestart=unexpected
startsecs=0
exitcodes=0
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
