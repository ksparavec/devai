# cgroup.conf of devai-slurm (platform-rebuild Phase 5, Open question 2).
#
# No cgroups at all: a job script only sends bus commands, so nothing is
# confined (ProctrackType=proctrack/linuxproc, TaskPlugin=task/none,
# JobAcctGatherType=jobacct_gather/none in slurm.conf). Without this file
# slurmd 24.11.5 autodetects cgroup/v2 and, in an unprivileged container
# with no systemd, dies at start: "cgroup_dbus_attach_to_scope: cannot
# connect to dbus system daemon ... fatal: systemd scope for slurmstepd
# could not be set" (measured 2026-10-07, rootless podman 5.4.2, default
# user namespace, no --privileged).
CgroupPlugin=disabled
