# Backend launch flags — names of CLI arguments per backend image.
#
# This file pins the *name* of each launch-time flag the router and
# probers emit. The value passed to each flag is dynamic (model path,
# context length, parser names from the probe cache) — only the flag
# name itself is curated here.
#
# Why this exists: SGLang and vLLM both rename CLI surfaces between
# minor versions. When bumping either image, run:
#
#   make verify-backend-flags
#
# which dumps `--help` from each pinned image and asserts every flag
# below is present. Drift fails fast with a clear pointer to this file
# instead of producing silent infra-class probe failures or busted
# router launches.
#
# Pinned images (override via env var if you need a different build):
#
#   VLLM_IMAGE   = docker.io/vllm/vllm-openai:v0.22.1-x86_64-cu129-ubuntu2404
#                  (vLLM 0.19.1+, CUDA 13, Ubuntu 24.04)
#   SGLANG_IMAGE = docker.io/lmsysorg/sglang:v0.5.16-cu130
#                  (SGLang 0.5.16, CUDA 13)
#
# Verified 2026-04-29 against the images above; SGLang re-verified
# 2026-07-28 (--tp corrected to --tp-size; served_model_name and
# max_running_requests added) and again 2026-07-29 on the v0.5.16 bump
# (all 18 names still present -- no drift; disable_piecewise_cuda_graph
# retired, see below).

vllm:
  model:                "--model"
  served_model_name:    "--served-model-name"
  host:                 "--host"
  port:                 "--port"
  tensor_parallel_size: "--tensor-parallel-size"
  max_model_len:        "--max-model-len"
  # Emitted from MAX_CONCURRENT_REQUESTS by both the router and the
  # probers; pinned for the same reason as SGLang's analogue above.
  max_num_seqs:         "--max-num-seqs"
  gpu_memory_util:      "--gpu-memory-utilization"
  # Per-model KV-cache dtype. Emitted by BOTH entrypoints (gpu-arbiter
  # vllmEntrypoint / sglangEntrypoint and the two probers), and the fit
  # cells are only valid under the dtype they were measured with -- an
  # unnoticed rename here silently invalidates every cached fit verdict.
  kv_cache_dtype:       "--kv-cache-dtype"
  enable_prefix_cache:  "--enable-prefix-caching"
  trust_remote_code:    "--trust-remote-code"
  enable_auto_tool:     "--enable-auto-tool-choice"
  tool_call_parser:     "--tool-call-parser"
  reasoning_parser:     "--reasoning-parser"
  # Plugin-file variants, emitted when a parser resolves through the
  # vllm-plugins registry (scripts/vllm_plugins). Emitted for months
  # without a pin -- found by TestEmittedFlagsArePinned, which checks the
  # direction this file never did: that everything EMITTED is pinned.
  reasoning_parser_plugin: "--reasoning-parser-plugin"
  tool_parser_plugin:      "--tool-parser-plugin"
  # Multi-token-prediction launch flag (Phase 4 of the
  # catalog-crystalline-beaver plan). Single JSON argument carries
  # method, optional drafter path, and num_speculative_tokens.
  speculative_config:   "--speculative-config"

sglang:
  model_path:           "--model-path"
  host:                 "--host"
  port:                 "--port"
  # --tp does NOT exist on the pinned image; only --tp-size does. The old
  # `--tp` spelling worked ONLY by argparse prefix matching, and it made
  # `make verify-backend-flags` red -- so the drift gate this file exists
  # to power was failing on the very file that defines it. Verified
  # 2026-07-28 against v0.5.10.post1-cu130.
  tp_size:              "--tp-size"
  # The engine's internal identity. Without it SGLang falls back to
  # model_path, so `/v1/models` advertises `/models/<name>` -- an id the
  # router answers 404 for. It does NOT default to the directory basename.
  served_model_name:    "--served-model-name"
  # Analogue of vLLM's --max-num-seqs. Emitted by the router from
  # MAX_CONCURRENT_REQUESTS and by the prober, but never pinned, so a
  # rename would have gone unnoticed until launches started failing.
  max_running_requests: "--max-running-requests"
  context_length:       "--context-length"
  mem_fraction_static:  "--mem-fraction-static"
  # Same flag spelling as vLLM on the pinned image, but emitted only when
  # a probe pass enforced a dtype (SGLang's default is the unquantized
  # engine default, i.e. no flag). Pinned so an image bump that renames it
  # fails the gate instead of silently dropping quantized-KV support.
  kv_cache_dtype:       "--kv-cache-dtype"
  trust_remote_code:    "--trust-remote-code"
  tool_call_parser:     "--tool-call-parser"
  reasoning_parser:     "--reasoning-parser"
  # disable_piecewise_cuda_graph was pinned here while the router and
  # prober passed --disable-piecewise-cuda-graph on every SGLang launch.
  # v0.5.10's piecewise prefill graph torch.compiled the forward and
  # Dynamo could not trace flashinfer's FP4 JIT path
  # (modelopt_quant.py:1482), so every NVFP4 load crashed. v0.5.16
  # replaced it with the breakable prefill graph, which does not take
  # that path; NVFP4 now loads with no workaround (measured on this
  # fleet). Neither caller emits the flag any more, so pinning it would
  # assert a name nothing depends on.
  # Multi-token-prediction launch flags (pinned for forward-compat;
  # the probe driver doesn't exercise them today since SGLang's NVFP4
  # path is broken upstream -- see scripts/model-families.yaml:60-72).
  # The router emits these when the catalog row carries an `mtp:` block
  # AND the request name carries `::mtp`. When SGLang's NVFP4 loader is
  # repaired, run `make verify-backend-flags` to assert the pinned image
  # still exposes them.
  speculative_algorithm:        "--speculative-algorithm"
  speculative_num_steps:        "--speculative-num-steps"
  speculative_num_draft_tokens: "--speculative-num-draft-tokens"
  speculative_eagle_topk:       "--speculative-eagle-topk"
  speculative_draft_model_path: "--speculative-draft-model-path"
