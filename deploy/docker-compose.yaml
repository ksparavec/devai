services:
  # Loopback-only publish: apt-cacher-ng is an unauthenticated open HTTP
  # proxy. Its only consumers are image builds, which run `podman build
  # --network=host` with APT_PROXY=http://localhost:3142 (host netns -> host
  # loopback). Nothing documented reaches it from another host.
  #
  # NOT on devai-lab-egress (platform-rebuild Phase 2): it proxies any host,
  # over CONNECT and over plain http, so from the egress-locked lab it was a
  # way out around pipelock (tested 2026-10-10: example.com 200 both ways).
  # The lab's apt never used it -- the lab configures no apt proxy -- and
  # goes through pipelock like everything else.
  #
  # Built here (`make build-apt-cache`, deploy/Dockerfile.apt-cache): Debian's
  # apt-cacher-ng as uid 101, the owner of the files already in the cache.
  apt-cache:
    image: localhost/devai-apt-cache:latest
    container_name: devai-apt-cache
    hostname: apt-cache
    ports:
      - "127.0.0.1:3142:3142"
    volumes:
      - /var/cache/devai/apt:/var/cache/apt-cacher-ng
    networks: [default]
    # deploy/apt-cache-healthcheck.sh, baked into the image: one GET of the
    # report page. No argument here may contain a space: podman-compose
    # splits them, and `bash -c "<script>"` became `bash -c exec`, which
    # passed whatever the daemon did.
    healthcheck:
      test: ["CMD", "/usr/local/bin/apt-cache-healthcheck"]
      interval: 10s
      timeout: 2s
      retries: 3
    restart: unless-stopped

  ollama:
    # Built HERE by `make build-ollama`, never pulled: Ollama compiled from
    # source on the host, on debian:trixie-slim, with the CUDA 13 backend for
    # this machine's GPU only (752 MB against 4.75 GB for the stock
    # ollama/ollama image). Same entrypoint/cmd/port/env/model path as the
    # stock image, so nothing else in this service changes.
    # Explicit `localhost/` prefix for the same reason as the router below.
    image: ${OLLAMA_IMAGE:-localhost/devai-ollama:latest}
    container_name: devai-ollama
    hostname: ollama
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-300s}
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-262144}
      # Reserved bytes off the visible VRAM. Set non-zero by `make probe`
      # to simulate a smaller GPU during probing (so a 24G host can produce
      # cache cells valid for a 16G target). 0 = no constraint.
      - OLLAMA_GPU_OVERHEAD=${OLLAMA_GPU_OVERHEAD:-0}
      # KV-cache dtype pass-through for probe passes (empty = f16 default).
      # `make probe PROBE_KV_CACHE_TYPE=q8_0` sets these for the daemon so
      # the probed cell reflects quantized-KV memory; the cell is stamped
      # kv_cache_type and the router reproduces the dtype at serve time
      # per covered ctx tier. Do NOT set globally in .env without a
      # long-reasoning re-bench: q8_0 measurably degrades GPQA (see
      # deploy/.bench-cache.json row ...::ollama::131072).
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE:-}
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-}
    volumes:
      - /var/cache/devai/ollama:/root/.ollama
    devices:
      - ${DEVAI_GPU_DEVICE:-nvidia.com/gpu=all}
    security_opt:
      - label=disable
    restart: unless-stopped

  # vLLM is router-managed: the gpu-arbiter replaces these containers on
  # demand via libpod when a request arrives on the backend's port
  # (11435/11437). SGLang (11436) was frozen by platform-rebuild Phase 15
  # (M16); its service is kept in attic/sglang/frozen-branches.txt.
  # The compose `entrypoint: sleep` is a
  # placeholder so `make cache-up` produces a clean idle container the
  # router can stop+recreate atomically — without it, a real entrypoint
  # would either fail at boot (wrong model path) or claim the GPU
  # before ollama could load. See docs/backends.md.
  vllm:
    image: ${VLLM_IMAGE:-docker.io/vllm/vllm-openai:v0.22.1-x86_64-cu129-ubuntu2404}
    container_name: devai-vllm
    hostname: vllm
    volumes:
      - /var/cache/devai/vllm:/models:ro
    entrypoint: ["sleep", "infinity"]
    devices:
      - ${DEVAI_GPU_DEVICE:-nvidia.com/gpu=all}
    security_opt:
      - label=disable
    restart: "no"

  # The home-built, HyperQwen-patched vLLM 0.28.0 (make build-vllm): a
  # FOURTH backend on router port 11437 with its own probe cache, so the
  # stock vLLM above and the custom build can be addressed side by side.
  # The image carries a docker.io name but exists only in the local store
  # (nothing is pushed): pull_policy never, and `make pull-images` excludes
  # it by the `devai-` in its name.
  vllm-devai:
    image: ${VLLM_DEVAI_IMAGE:-docker.io/devai/vllm-devai:latest}
    pull_policy: never
    container_name: devai-vllm-devai
    hostname: vllm-devai
    volumes:
      - /var/cache/devai/vllm:/models:ro
    entrypoint: ["sleep", "infinity"]
    devices:
      - ${DEVAI_GPU_DEVICE:-nvidia.com/gpu=all}
    security_opt:
      - label=disable
    restart: "no"

  # The laya trainer (docs/plans/laya-trainer.md): a JOB runner on router
  # port 11438, not an inference engine. Same placeholder pattern as the HF
  # backends -- the router recreates it with the controller on the first job
  # request -- so the logger follows it and cache-up/-down know it.
  # `make build-laya-trainer` builds the image (local only, never pulled);
  # cache-up skips this placeholder until it exists.
  laya-trainer:
    image: ${LAYA_TRAINER_IMAGE:-localhost/devai-laya-trainer:latest}
    pull_policy: never
    container_name: devai-laya-trainer
    hostname: laya-trainer
    volumes:
      - /var/cache/devai/laya:/laya
    entrypoint: ["sleep", "infinity"]
    devices:
      - ${DEVAI_GPU_DEVICE:-nvidia.com/gpu=all}
    security_opt:
      - label=disable
    restart: "no"

  # devai-slurm (docs/slurm.md Sec. 3.1; platform-rebuild Phase 5): Slurm
  # (slurmctld, slurmdbd, slurmrestd, slurmd), MariaDB, nats-server and the
  # bus log in ONE container, built here (`make build-slurm`), never pulled.
  # Behind the `slurm` profile until Phase 9 makes the router its client:
  # `make slurm-up` / `make slurm-down`; `make cache-up` leaves it alone.
  #
  # - pid: host -- the GPU guard and the sampler see and signal GPU holders,
  #   whose PIDs NVML reports in the host namespace; tini -s (the image's
  #   entrypoint) reaps, since it is not PID 1 here.
  # - podman's default user namespace (no userns_mode; I26): its root is the
  #   host user, so the guard can kill holders in rootless containers; jobs
  #   run as devai, a subordinate uid, and cannot read the keys.
  # - devai-net only, nothing published (C6, I13): slurmrestd :6820 and NATS
  #   :4222 are reached by name on devai-net; no podman socket.
  # - /run/devai is a tmpfs: the rendered nats-server.conf, the jobs bus
  #   password copy, the sampler files.
  # - The GPU for NVML only; no CUDA work runs here. Phase 11 makes it
  #   optional (compose.gpu.yaml).
  slurm:
    image: ${SLURM_IMAGE:-localhost/devai-slurm:latest}
    pull_policy: never
    profiles: [slurm]
    container_name: devai-slurm
    hostname: devai-slurm
    networks: [default]
    pid: host
    tmpfs:
      - /run/devai
    environment:
      # For devai-jobs under `podman exec devai-slurm` (bin/devai-jobs; C7).
      - SLURM_REST_URL=http://127.0.0.1:6820
      - SLURM_JWT_KEY_FILE=/etc/slurm/jwt_hs256.key
      - SLURM_USER=devai
    volumes:
      - /var/cache/devai/jobs:/var/cache/devai/jobs
      # C7's files (make slurm-init), read-only: slurm.key, jwt_hs256.key,
      # mariadb.pass and every bus user's nats/<user>.pass, which the
      # entrypoint renders into nats-server.conf.
      - ${DEVAI_SLURM_CONFIG_DIR:-${HOME}/.config/devai/slurm}:/etc/devai/slurm:ro
    devices:
      - ${DEVAI_GPU_DEVICE:-nvidia.com/gpu=all}
    security_opt:
      - label=disable
    restart: unless-stopped

  router:
    # Fully-qualified to bypass unqualified-search-registries (docker.io)
    # in registries.conf. Built by `make build-router` (the host's Go, then
    # deploy/Dockerfile.router), which tags `localhost/devai-router:latest`;
    # compose has no build stanza because the binary is compiled outside it.
    image: localhost/devai-router:latest
    container_name: devai-router
    hostname: router
    networks: [default, devai-lab-egress]   # also reachable by the egress-locked lab
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_PORT=11434
      # The router RECREATES devai-ollama for pinned KV tiers. It only sees
      # what compose hands it, so without this it would recreate from its own
      # default and silently put the container back on a different image.
      - OLLAMA_IMAGE=${OLLAMA_IMAGE:-localhost/devai-ollama:latest}
      - VLLM_URL=http://vllm:11434
      - VLLM_PORT=11435
      - VLLM_CONTAINER=devai-vllm
      - VLLM_IMAGE=${VLLM_IMAGE:-docker.io/vllm/vllm-openai:v0.22.1-x86_64-cu129-ubuntu2404}
      - VLLM_MODELS_DIR=/var/cache/devai/vllm
      - VLLM_DEVAI_URL=http://vllm-devai:11434
      - VLLM_DEVAI_PORT=11437
      - VLLM_DEVAI_CONTAINER=devai-vllm-devai
      - VLLM_DEVAI_IMAGE=${VLLM_DEVAI_IMAGE:-docker.io/devai/vllm-devai:latest}
      # The laya trainer, a job runner (gpu-arbiter/job_runner.go). While a
      # job runs, requests that need the GPU for another backend get 503 +
      # Retry-After instead of evicting it, for at most LAYA_MAX_HOLD_S
      # counted from the job's start (0 = no cap). 900 s: about 6x the measured
      # jobs (123-140 s, plan Phase 4, 2026-09-25), owner decision.
      - LAYA_TRAINER_URL=http://laya-trainer:11434
      - LAYA_TRAINER_PORT=11438
      - LAYA_TRAINER_CONTAINER=devai-laya-trainer
      - LAYA_TRAINER_IMAGE=${LAYA_TRAINER_IMAGE:-localhost/devai-laya-trainer:latest}
      - LAYA_STORE_DIR=/var/cache/devai/laya
      - LAYA_CATALOG_FILE=/etc/devai/laya-models.yaml
      - LAYA_MAX_HOLD_S=${LAYA_MAX_HOLD_S:-900}
      - LAYA_JOB_TIMEOUT_S=${LAYA_JOB_TIMEOUT_S:-0}
      - NETWORK=devai-net
      - IDLE_TIMEOUT=${IDLE_TIMEOUT:-0}
      - DRAIN_TIMEOUT=${DRAIN_TIMEOUT:-30}
      - HEALTH_TIMEOUT_SECONDS=${HEALTH_TIMEOUT_SECONDS:-600}
      - MAX_CONCURRENT_REQUESTS=${MAX_CONCURRENT_REQUESTS:-32}
      # SSE keepalive during cold start. Forwarded explicitly because the
      # router only ever sees what compose hands it -- a knob documented
      # but not listed here is inert, and silently so.
      - DEVAI_SSE_KEEPALIVE_SECONDS=${DEVAI_SSE_KEEPALIVE_SECONDS:-10}
      - DEVAI_SSE_KEEPALIVE_GRACE_SECONDS=${DEVAI_SSE_KEEPALIVE_GRACE_SECONDS:-5}
      # Launch circuit breaker: consecutive failed launches of the same
      # (model, ctx) before the router refuses to keep retrying. 0 disables.
      - DEVAI_MAX_FAILED_LAUNCHES=${DEVAI_MAX_FAILED_LAUNCHES:-3}
      # Request fingerprints (docs/router.md "Request fingerprints"): one
      # content-free line per POST when on; _RAW logs every body in full.
      - DEVAI_REQUEST_FINGERPRINT=${DEVAI_REQUEST_FINGERPRINT:-off}
      - DEVAI_REQUEST_FINGERPRINT_RAW=${DEVAI_REQUEST_FINGERPRINT_RAW:-off}
      - GPU_MEMORY_GB=${GPU_MEMORY_GB:-24}
      # The CDI device string the router stamps onto the vLLM/SGLang
      # containers it recreates (main.go, containerRecreate). The compose
      # services above interpolate ${DEVAI_GPU_DEVICE} into their OWN
      # device lists, but the router does not inherit the shell that ran
      # compose -- so without this line it fell back to the hardcoded
      # nvidia.com/gpu=all default and every router-recreated backend got
      # that default regardless of a DEVAI_GPU_DEVICE override.
      - DEVAI_GPU_DEVICE=${DEVAI_GPU_DEVICE:-nvidia.com/gpu=all}
      - MAX_CONTEXT_LEN=${MAX_CONTEXT_LEN:-262144}
      - DEVAI_REASONING=${DEVAI_REASONING:-auto}
      - PODMAN_SOCKET=/run/podman/podman.sock
      # vLLM parser-plugin registry. The router reads the JSON map at
      # VLLM_PLUGINS_REGISTRY (mounted below) and bind-mounts
      # VLLM_PLUGINS_HOST_DIR into the recreated vLLM container at
      # /etc/devai/vllm-plugins so plugin .py files resolve to the
      # path passed via `--tool-parser-plugin`. Empty host_dir → only
      # built-in vLLM parsers are usable; any model whose probe cache
      # row points at a plugin parser will fail at recreate time with
      # an actionable error rather than silently launching wrong.
      - VLLM_PLUGINS_REGISTRY=/etc/devai/vllm-plugins.json
      - VLLM_PLUGINS_HOST_DIR=${VLLM_PLUGINS_HOST_DIR:-}
      # Per-model recovery flags + env: the hand-curated
      # deploy/recovery-flags.json, then the machine-made
      # deploy/recovery-flags.generated.json (plan I25; scripts/recipe-apply.py
      # writes it). Same two files the vLLM/SGLang probers read, so probe and
      # serve-time launches stay in sync. Both are read from the deploy/
      # DIRECTORY mount below and re-read at each launch when either changed
      # (gpu-arbiter/recovery_flags.go). Missing file -> no per-model
      # overrides from it.
      - RECOVERY_FLAGS_REGISTRY=/etc/devai/deploy/recovery-flags.json
      - RECOVERY_FLAGS_GENERATED=/etc/devai/deploy/recovery-flags.generated.json
      # Advertisement vetting (gpu-arbiter/advertise.go). The router lists
      # on /v1/models and /api/tags ONLY models that are probed AND
      # benched AND have weights in that backend's own store AND carry no
      # bench verdict. Anything withheld stays SERVEABLE by explicit name,
      # which is what lets `make bench-*` earn a model its first bench row
      # -- the bench harness drives every task through the router. Missing
      # files are not fatal: they mean "nothing benched", so nothing is
      # advertised, and the per-backend startup line says so.
      - BENCH_CACHE=/etc/devai/.bench-cache.json
      - MODEL_STATUS_LEDGER=/etc/devai/.model-status.json
    volumes:
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/podman/podman.sock:/run/podman/podman.sock
      # Probe caches (schema v3 for Ollama digest-keyed; schema v1 for
      # vLLM/SGLang repo+sha-keyed). Each is independent — missing
      # files are not fatal, the corresponding backend just exposes no
      # models. The router reads them via PROBE_CACHE / VLLM_PROBE_CACHE
      # / VLLM_DEVAI_PROBE_CACHE env vars (defaults match these mount paths).
      - ./.ollama-reasoning-cache.json:/etc/devai/.ollama-reasoning-cache.json:ro
      - ./.vllm-reasoning-cache.json:/etc/devai/.vllm-reasoning-cache.json:ro
      - ./.vllm-devai-reasoning-cache.json:/etc/devai/.vllm-devai-reasoning-cache.json:ro
      # Catalog metadata side-table -- the router reads `mtp:` blocks
      # from deploy/models.yaml at startup to thread MTP launch params
      # into configModel rows (see loadCatalogMTP). Missing file = empty
      # registry = MTP off for everyone; safe degradation.
      - ./models.yaml:/etc/devai/models.yaml:ro
      # The laya catalog: the trainer's model allowlist (base checkpoint
      # names). Not part of models.yaml, whose readers assume LLM rows.
      - ./laya-models.yaml:/etc/devai/laya-models.yaml:ro
      # Plugin registry — the JSON map of parser-name → plugin-file.
      # The host plugin directory is NOT mounted into the router itself;
      # the router only needs the host path string (passed via env) to
      # forward to libpod when recreating the vLLM container.
      - ./vllm-plugins.json:/etc/devai/vllm-plugins.json:ro
      # The repository's deploy/ directory, read-only, for the two recovery
      # files (RECOVERY_FLAGS_REGISTRY / RECOVERY_FLAGS_GENERATED above).
      # A DIRECTORY, not single files: a file replaced with a new inode (the
      # writers' rename, git checkout's unlink and create) is invisible
      # through a single-file bind mount, which pins the old inode and goes
      # on serving the old content (plan I25). Absolute and
      # required: an unset DEVAI_REPO stops compose instead of mounting
      # /deploy. The Makefile exports DEVAI_REPO=$(CURDIR); scripts that run
      # compose themselves default it to the repository root.
      - ${DEVAI_REPO:?DEVAI_REPO must be set to the repository root (the Makefile exports it)}/deploy:/etc/devai/deploy:ro
      # Bench cache + exclusion ledger, read once at startup for
      # advertisement vetting (see BENCH_CACHE / MODEL_STATUS_LEDGER
      # above). Read-only: the router is a consumer of both, never a
      # writer -- the bench harness and `make model-status` own them.
      - ./.bench-cache.json:/etc/devai/.bench-cache.json:ro
      - ./.model-status.json:/etc/devai/.model-status.json:ro
      # The HF weight stores, read-only, at the SAME paths the router
      # hands to libpod as the backend containers' bind source -- so
      # VLLM_MODELS_DIR needs no translation between
      # "path I mount into the engine" and "path I can stat myself".
      # Used ONLY by checkModelWeights, which fails a launch fast when
      # the probe cache advertises a model whose weights were never
      # downloaded (as the SGLang store once did). Read-only: the
      # router must never write into a model store.
      - ${VLLM_MODELS_DIR:-/var/cache/devai/vllm}:${VLLM_MODELS_DIR:-/var/cache/devai/vllm}:ro
    depends_on:
      - ollama
    restart: unless-stopped

  # Aggregates stdout from every devai-* service into per-container
  # log files on the host (/var/cache/devai/logs/<name>.log). Survives
  # source-container recreation — the follower reconnects to the new
  # container of the same name within 5 seconds. Uses podman + sh only;
  # no third-party log daemon. The image is the upstream podman client
  # so we can call `podman logs --follow` against the host's socket.
  logger:
    image: quay.io/podman/stable
    container_name: devai-logger
    hostname: logger
    user: "0"
    entrypoint: ["/bin/sh"]
    command: ["/scripts/logging.sh"]
    environment:
      # Empty → discover devai-* containers at startup. Override to a
      # space-separated list to follow a specific subset.
      - LOG_TARGETS=
      - LOG_DIR=/logs
    volumes:
      - ./logging.sh:/scripts/logging.sh:ro
      - /var/cache/devai/logs:/logs
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/podman/podman.sock:/run/podman/podman.sock:ro
    network_mode: none
    restart: unless-stopped

  # Egress firewall for the lab. The lab joins ONLY the internal
  # devai-lab-egress network (no internet route); pipelock is dual-homed
  # (devai-net = internet leg + devai-lab-egress = serves the lab) and is the
  # lab's ONLY path out. It MITM-inspects TLS, DLP-blocks accidental secret
  # egress (buggy-leak posture), and logs every decision (captured by the
  # logger sidecar). See docs/pipelock.md. Always-on -- the locked lab depends
  # on it. Requires an operator-bootstrapped CA (`make pipelock-ca-init`);
  # without the host key it fails its healthcheck and the launcher refuses to
  # start the lab (fail-closed, not fail-open).
  #
  # Built here (`make build-pipelock`): scripts/build-pipelock.sh compiles
  # the version that ran from ghcr.io until platform-rebuild Phase 2, and
  # deploy/Dockerfile.pipelock keeps that image's paths.
  pipelock:
    image: localhost/devai-pipelock:latest
    container_name: devai-pipelock
    hostname: pipelock
    command: ["run", "--listen", "0.0.0.0:8888", "--config", "/config/pipelock.yaml"]
    networks: [default, devai-lab-egress]
    volumes:
      - ./pipelock.yaml:/config/pipelock.yaml:ro
      - ./pipelock-ca.crt:/config/ca.crt:ro
      # CA private key. `make cache-up` sets PIPELOCK_CA_KEY_FILE to the host
      # key (~/.config/devai/pipelock-ca-key.pem, from `make pipelock-ca-init`).
      # Defaults to /dev/null so installs that haven't bootstrapped the CA still
      # parse; pipelock then fails its healthcheck and the lab launcher refuses
      # to start (fail-closed).
      - ${PIPELOCK_CA_KEY_FILE:-/dev/null}:/config/ca-key.pem:ro
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "/pipelock", "healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped

networks:
  default:
    name: devai-net
    external: true
  # Internal (no-NAT) network the lab is confined to. Created with --internal
  # by `make cache-up`; declared external here so compose attaches to the
  # Makefile-created net rather than managing its lifecycle.
  devai-lab-egress:
    name: devai-lab-egress
    external: true
