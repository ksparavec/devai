services:
  # Loopback-only publish: apt-cacher-ng is an unauthenticated open HTTP
  # proxy. Its only consumers reach it over loopback or over devai-net --
  # image builds run `podman build --network=host` with
  # APT_PROXY=http://localhost:3142 (host netns -> host loopback), and the
  # egress-locked lab reaches it by service name on devai-lab-egress, which
  # is unaffected by port publishing. Nothing documented reaches it from
  # another host.
  apt-cache:
    image: sameersbn/apt-cacher-ng:latest
    container_name: devai-apt-cache
    hostname: apt-cache
    ports:
      - "127.0.0.1:3142:3142"
    volumes:
      - /var/cache/devai/apt:/var/cache/apt-cacher-ng
    networks: [default, devai-lab-egress]   # also reachable by the egress-locked lab
    restart: unless-stopped

  # Loopback-only publish, same reasoning as apt-cache above: the mirror
  # is an unauthenticated pull-through registry, and its only consumer is
  # the host's own podman via deploy/registries.conf, which hardcodes
  # `location = "localhost:5000"`.
  registry-cache:
    image: registry:2
    container_name: devai-registry-cache
    hostname: registry-cache
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - /var/cache/devai/registry:/var/lib/registry
      - ./registry-config.yaml:/etc/docker/registry/config.yml:ro
    networks: [default, devai-lab-egress]   # also reachable by the egress-locked lab
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: devai-ollama
    hostname: ollama
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-300s}
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-262144}
      # Reserved bytes off the visible VRAM. Set non-zero by `make probe`
      # to simulate a smaller GPU during probing (so a 24G host can produce
      # cache cells valid for a 16G target). 0 = no constraint.
      - OLLAMA_GPU_OVERHEAD=${OLLAMA_GPU_OVERHEAD:-0}
      # KV-cache dtype pass-through for probe passes (empty = f16 default).
      # `make probe PROBE_KV_CACHE_TYPE=q8_0` sets these for the daemon so
      # the probed cell reflects quantized-KV memory; the cell is stamped
      # kv_cache_type and the router reproduces the dtype at serve time
      # per covered ctx tier. Do NOT set globally in .env without a
      # long-reasoning re-bench: q8_0 measurably degrades GPQA (see
      # deploy/.bench-cache.json row ...::ollama::131072).
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE:-}
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-}
    volumes:
      - /var/cache/devai/ollama:/root/.ollama
    devices:
      - ${DEVAI_GPU_DEVICE:-nvidia.com/gpu=all}
    security_opt:
      - label=disable
    restart: unless-stopped

  # vLLM and SGLang are router-managed: the gpu-arbiter replaces these
  # containers on demand via libpod when a request arrives on the
  # backend's port (11435/11436). The compose `entrypoint: sleep` is a
  # placeholder so `make cache-up` produces a clean idle container the
  # router can stop+recreate atomically — without it, a real entrypoint
  # would either fail at boot (wrong model path) or claim the GPU
  # before ollama could load. See docs/backends.md.
  vllm:
    image: ${VLLM_IMAGE:-docker.io/vllm/vllm-openai:v0.22.1-x86_64-cu129-ubuntu2404}
    container_name: devai-vllm
    hostname: vllm
    volumes:
      - /var/cache/devai/vllm:/models:ro
    entrypoint: ["sleep", "infinity"]
    devices:
      - ${DEVAI_GPU_DEVICE:-nvidia.com/gpu=all}
    security_opt:
      - label=disable
    restart: "no"

  sglang:
    image: ${SGLANG_IMAGE:-docker.io/lmsysorg/sglang:v0.5.16-cu130}
    container_name: devai-sglang
    hostname: sglang
    volumes:
      - /var/cache/devai/sglang:/models:ro
    entrypoint: ["sleep", "infinity"]
    devices:
      - ${DEVAI_GPU_DEVICE:-nvidia.com/gpu=all}
    security_opt:
      - label=disable
    restart: "no"

  router:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.router
    # Fully-qualified to bypass unqualified-search-registries (docker.io)
    # in registries.conf — otherwise the local mirror at localhost:5000
    # can shadow the locally-built image with a stale `docker.io/library/...`
    # copy. `make build-router` tags as `localhost/devai-router:latest`.
    image: localhost/devai-router:latest
    container_name: devai-router
    hostname: router
    networks: [default, devai-lab-egress]   # also reachable by the egress-locked lab
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_PORT=11434
      - VLLM_URL=http://vllm:11434
      - VLLM_PORT=11435
      - VLLM_CONTAINER=devai-vllm
      - VLLM_IMAGE=${VLLM_IMAGE:-docker.io/vllm/vllm-openai:v0.22.1-x86_64-cu129-ubuntu2404}
      - VLLM_MODELS_DIR=/var/cache/devai/vllm
      - SGLANG_URL=http://sglang:11434
      - SGLANG_PORT=11436
      - SGLANG_CONTAINER=devai-sglang
      - SGLANG_IMAGE=${SGLANG_IMAGE:-docker.io/lmsysorg/sglang:v0.5.16-cu130}
      - SGLANG_MODELS_DIR=/var/cache/devai/sglang
      - NETWORK=devai-net
      - IDLE_TIMEOUT=${IDLE_TIMEOUT:-0}
      - DRAIN_TIMEOUT=${DRAIN_TIMEOUT:-30}
      - HEALTH_TIMEOUT_SECONDS=${HEALTH_TIMEOUT_SECONDS:-600}
      - MAX_CONCURRENT_REQUESTS=${MAX_CONCURRENT_REQUESTS:-32}
      # SSE keepalive during cold start. Forwarded explicitly because the
      # router only ever sees what compose hands it -- a knob documented
      # but not listed here is inert, and silently so.
      - DEVAI_SSE_KEEPALIVE_SECONDS=${DEVAI_SSE_KEEPALIVE_SECONDS:-10}
      - DEVAI_SSE_KEEPALIVE_GRACE_SECONDS=${DEVAI_SSE_KEEPALIVE_GRACE_SECONDS:-5}
      # Launch circuit breaker: consecutive failed launches of the same
      # (model, ctx) before the router refuses to keep retrying. 0 disables.
      - DEVAI_MAX_FAILED_LAUNCHES=${DEVAI_MAX_FAILED_LAUNCHES:-3}
      - GPU_MEMORY_GB=${GPU_MEMORY_GB:-24}
      # The CDI device string the router stamps onto the vLLM/SGLang
      # containers it recreates (main.go, containerRecreate). The compose
      # services above interpolate ${DEVAI_GPU_DEVICE} into their OWN
      # device lists, but the router does not inherit the shell that ran
      # compose -- so without this line it fell back to the hardcoded
      # nvidia.com/gpu=all default and every router-recreated backend was
      # NVIDIA regardless of `make gpu-vendor VENDOR=amd`.
      - DEVAI_GPU_DEVICE=${DEVAI_GPU_DEVICE:-nvidia.com/gpu=all}
      - MAX_CONTEXT_LEN=${MAX_CONTEXT_LEN:-262144}
      - DEVAI_REASONING=${DEVAI_REASONING:-auto}
      - PODMAN_SOCKET=/run/podman/podman.sock
      # vLLM parser-plugin registry. The router reads the JSON map at
      # VLLM_PLUGINS_REGISTRY (mounted below) and bind-mounts
      # VLLM_PLUGINS_HOST_DIR into the recreated vLLM container at
      # /etc/devai/vllm-plugins so plugin .py files resolve to the
      # path passed via `--tool-parser-plugin`. Empty host_dir → only
      # built-in vLLM parsers are usable; any model whose probe cache
      # row points at a plugin parser will fail at recreate time with
      # an actionable error rather than silently launching wrong.
      - VLLM_PLUGINS_REGISTRY=/etc/devai/vllm-plugins.json
      - VLLM_PLUGINS_HOST_DIR=${VLLM_PLUGINS_HOST_DIR:-}
      # Per-model recovery flags + env (deploy/recovery-flags.json).
      # Same JSON read by the vLLM/SGLang probers so probe and serve-time
      # launches stay in sync. Missing file → no per-model overrides;
      # behaviour identical to pre-registry builds.
      - RECOVERY_FLAGS_REGISTRY=/etc/devai/recovery-flags.json
      # Advertisement vetting (gpu-arbiter/advertise.go). The router lists
      # on /v1/models and /api/tags ONLY models that are probed AND
      # benched AND have weights in that backend's own store AND carry no
      # bench verdict. Anything withheld stays SERVEABLE by explicit name,
      # which is what lets `make bench-*` earn a model its first bench row
      # -- the bench harness drives every task through the router. Missing
      # files are not fatal: they mean "nothing benched", so nothing is
      # advertised, and the per-backend startup line says so.
      - BENCH_CACHE=/etc/devai/.bench-cache.json
      - MODEL_STATUS_LEDGER=/etc/devai/.model-status.json
    volumes:
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/podman/podman.sock:/run/podman/podman.sock
      # Probe caches (schema v3 for Ollama digest-keyed; schema v1 for
      # vLLM/SGLang repo+sha-keyed). Each is independent — missing
      # files are not fatal, the corresponding backend just exposes no
      # models. The router reads them via PROBE_CACHE / VLLM_PROBE_CACHE
      # / SGLANG_PROBE_CACHE env vars (defaults match these mount paths).
      - ./.ollama-reasoning-cache.json:/etc/devai/.ollama-reasoning-cache.json:ro
      - ./.vllm-reasoning-cache.json:/etc/devai/.vllm-reasoning-cache.json:ro
      - ./.sglang-reasoning-cache.json:/etc/devai/.sglang-reasoning-cache.json:ro
      # Catalog metadata side-table -- the router reads `mtp:` blocks
      # from deploy/models.yaml at startup to thread MTP launch params
      # into configModel rows (see loadCatalogMTP). Missing file = empty
      # registry = MTP off for everyone; safe degradation.
      - ./models.yaml:/etc/devai/models.yaml:ro
      # Plugin registry — the JSON map of parser-name → plugin-file.
      # The host plugin directory is NOT mounted into the router itself;
      # the router only needs the host path string (passed via env) to
      # forward to libpod when recreating the vLLM container.
      - ./vllm-plugins.json:/etc/devai/vllm-plugins.json:ro
      # Per-model recovery flags + env. See header comment in the JSON
      # file for schema; loaded by gpu-arbiter/recovery_flags.go.
      - ./recovery-flags.json:/etc/devai/recovery-flags.json:ro
      # Bench cache + exclusion ledger, read once at startup for
      # advertisement vetting (see BENCH_CACHE / MODEL_STATUS_LEDGER
      # above). Read-only: the router is a consumer of both, never a
      # writer -- the bench harness and `make model-status` own them.
      - ./.bench-cache.json:/etc/devai/.bench-cache.json:ro
      - ./.model-status.json:/etc/devai/.model-status.json:ro
      # The HF weight stores, read-only, at the SAME paths the router
      # hands to libpod as the backend containers' bind source -- so
      # VLLM_MODELS_DIR / SGLANG_MODELS_DIR need no translation between
      # "path I mount into the engine" and "path I can stat myself".
      # Used ONLY by checkModelWeights, which fails a launch fast when
      # the probe cache advertises a model whose weights were never
      # downloaded (the live SGLANG_MODELS_DIR gap). Read-only: the
      # router must never write into a model store.
      - ${VLLM_MODELS_DIR:-/var/cache/devai/vllm}:${VLLM_MODELS_DIR:-/var/cache/devai/vllm}:ro
      - ${SGLANG_MODELS_DIR:-/var/cache/devai/sglang}:${SGLANG_MODELS_DIR:-/var/cache/devai/sglang}:ro
    depends_on:
      - ollama
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: devai-open-webui
    hostname: open-webui
    environment:
      - OLLAMA_BASE_URL=http://router:11434
    volumes:
      - /var/cache/devai/open-webui:/app/backend/data
    depends_on:
      - router
    restart: unless-stopped

  webui-proxy:
    image: docker.io/library/nginx:alpine
    container_name: devai-webui-proxy
    hostname: webui-proxy
    ports:
      - "${WEBUI_PORT:-8443}:443"
    environment:
      - HOST_IP=${HOST_IP:-localhost}
    volumes:
      - ./webui-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./webui-proxy/entrypoint.sh:/entrypoint.sh:ro
      - ${HOME}/devai-home/.jupyter/ssl:/ssl:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - open-webui
    restart: unless-stopped

  # MCP Gateway (per docs/plans/mcp-gateway.md). Phase 1 ships the 10
  # Tier 1 servers (no secrets). Phase 2 adds the four Tier 2 servers
  # with sops-rendered secrets at /run/devai/mcp-secrets.env (mounted
  # only when present; absent on Phase 1 installs).
  #
  # Started by default per decision 5 in the plan. Operator can opt
  # out by setting MCP_PROFILE=mcp-disabled in .env (compose ignores
  # the service when its profile doesn't match).
  mcp-gateway:
    image: docker.io/docker/mcp-gateway:v0.43.3
    container_name: devai-mcp-gateway
    hostname: mcp-gateway
    restart: unless-stopped
    # Dual-homed, exactly like router/apt-cache/registry-cache/pipelock.
    # The lab containers sit on devai-lab-egress; a service published only
    # on devai-net is simply unresolvable from them, which is what made
    # this gateway unreachable from every agent regardless of its config.
    networks: [default, devai-lab-egress]
    # Loopback-only publish. This service holds a READ-WRITE podman socket
    # (below) and must keep it rw -- creating per-call MCP server containers
    # is its whole job -- so container-create here is equivalent to host
    # root. Binding the published port to 127.0.0.1 is the mitigation: it
    # keeps unauthenticated MCP tool calls off the LAN. Remote clients need
    # an SSH tunnel or an authenticating reverse proxy in front.
    ports:
      - "127.0.0.1:${MCP_PORT:-8088}:8088"
    volumes:
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/podman/podman.sock:/var/run/docker.sock:Z
      # First-party catalog only. Mounted under the gateway's catalogs
      # directory because v0.43.3 rejects a catalog path outside it --
      # the old /app/catalog.yaml mount breaks on this version.
      - ./mcp-catalog-devai.yaml:/root/.docker/mcp/catalogs/devai.yaml:ro
      # Phase 2 secrets mount. /run/devai/mcp-secrets.env is rendered
      # by `make mcp-secrets-render` from deploy/mcp-secrets.sops.env;
      # absent on Phase 1 installs. Compose tolerates the missing
      # source via the conditional bind path -- Podman will refuse to
      # start the container if the source doesn't exist, so consumers
      # who want Tier 2 must run mcp-secrets-render first; consumers
      # who only want Tier 1 should leave the MCP_SECRETS_FILE env
      # unset so this volume entry is dropped.
      - ${MCP_SECRETS_FILE:-/dev/null}:/secrets/.env:ro
      - mcp-state:/data
    command:
      # NOT --catalog: that REPLACES the built-in catalog. --additional-
      # catalog merges ours on top of Docker's official one, so all the
      # third-party servers below resolve from upstream (digest-pinned
      # and maintained there) and only devai-model-status comes from us.
      - "--additional-catalog=/root/.docker/mcp/catalogs/devai.yaml"
      # Without --servers the gateway enables NOTHING and serves only its
      # own mcp-find/mcp-add builtins -- a correct catalog alone yields
      # "0 tools listed". Names are upstream catalog keys and are
      # case-sensitive: `SQLite`, not `sqlite`.
      #
      # Tier 2 (github-official, firecrawl, hugging-face, context7) are
      # listed here but only github-official and firecrawl need secrets;
      # hugging-face and context7 are `type: remote` upstream and connect
      # anonymously, so they work on a Phase 1 install too.
      - "--servers=filesystem,git,SQLite,fetch,memory,time,sequentialthinking,duckduckgo,arxiv-mcp-server,wikipedia-mcp,github-official,firecrawl,hugging-face,context7,devai-model-status"
      - "--port=8088"
      - "--transport=streaming"
      - "--block-secrets"
      # Container-side path of the secrets mount above -- NOT an env-var
      # indirection. It has to name the same path the volume entry binds
      # to, otherwise a Phase 2 operator who renders /run/devai/mcp-secrets.env
      # and sets MCP_SECRETS_FILE still hands the gateway an empty file.
      # On Phase 1 installs the mount source is /dev/null, so this reads
      # as an empty secrets file and Tier 2 servers simply stay unusable.
      - "--secrets=/secrets/.env"
    security_opt:
      - "no-new-privileges:true"
    profiles: [mcp]

  # Aggregates stdout from every devai-* service into per-container
  # log files on the host (/var/cache/devai/logs/<name>.log). Survives
  # source-container recreation — the follower reconnects to the new
  # container of the same name within 5 seconds. Uses podman + sh only;
  # no third-party log daemon. The image is the upstream podman client
  # so we can call `podman logs --follow` against the host's socket.
  logger:
    image: quay.io/podman/stable
    container_name: devai-logger
    hostname: logger
    user: "0"
    entrypoint: ["/bin/sh"]
    command: ["/scripts/logging.sh"]
    environment:
      # Empty → discover devai-* containers at startup. Override to a
      # space-separated list to follow a specific subset.
      - LOG_TARGETS=
      - LOG_DIR=/logs
    volumes:
      - ./logging.sh:/scripts/logging.sh:ro
      - /var/cache/devai/logs:/logs
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/podman/podman.sock:/run/podman/podman.sock:ro
    network_mode: none
    restart: unless-stopped

  # Egress firewall for the lab. The lab joins ONLY the internal
  # devai-lab-egress network (no internet route); pipelock is dual-homed
  # (devai-net = internet leg + devai-lab-egress = serves the lab) and is the
  # lab's ONLY path out. It MITM-inspects TLS, DLP-blocks accidental secret
  # egress (buggy-leak posture), and logs every decision (captured by the
  # logger sidecar). See docs/pipelock.md. Always-on -- the locked lab depends
  # on it. Requires an operator-bootstrapped CA (`make pipelock-ca-init`);
  # without the host key it fails its healthcheck and the launcher refuses to
  # start the lab (fail-closed, not fail-open).
  pipelock:
    image: ghcr.io/luckypipewrench/pipelock:latest
    container_name: devai-pipelock
    hostname: pipelock
    command: ["run", "--listen", "0.0.0.0:8888", "--config", "/config/pipelock.yaml"]
    networks: [default, devai-lab-egress]
    volumes:
      - ./pipelock.yaml:/config/pipelock.yaml:ro
      - ./pipelock-ca.crt:/config/ca.crt:ro
      # CA private key. `make cache-up` sets PIPELOCK_CA_KEY_FILE to the host
      # key (~/.config/devai/pipelock-ca-key.pem, from `make pipelock-ca-init`).
      # Defaults to /dev/null so installs that haven't bootstrapped the CA still
      # parse; pipelock then fails its healthcheck and the lab launcher refuses
      # to start (fail-closed).
      - ${PIPELOCK_CA_KEY_FILE:-/dev/null}:/config/ca-key.pem:ro
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "/pipelock", "healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped

networks:
  default:
    name: devai-net
    external: true
  # Internal (no-NAT) network the lab is confined to. Created with --internal
  # by `make cache-up`; declared external here so compose attaches to the
  # Makefile-created net rather than managing its lifecycle.
  devai-lab-egress:
    name: devai-lab-egress
    external: true

volumes:
  # MCP gateway state (server logs, transient working data). Lives in
  # podman's named-volume storage; survives container restarts. Wipe
  # via `podman volume rm devai_mcp-state` if it ever gets corrupted.
  mcp-state:

