# DevAI model catalog — single source of truth for all model configuration.
# Read by: gpu-arbiter (router), Makefile targets (model list/pull/status)
#
# Each model declares which backends can serve it via the 'backend' list.
# The arbiter filters models per port: :11434 (ollama), :11435 (vllm), :11436 (sglang).

defaults:
  ollama: "qwen3.5:9b"
  vllm: "Qwen3.5-9B-NVFP4"
  sglang: "NVIDIA-Nemotron-Nano-9B-v2-NVFP4"

models:
  # --- Ollama GGUF models ---
  - name: "qwen3.5:9b"
    backend: [ollama]
    size: "6.6 GB"
    purpose: "Coding, general — fast daily driver"
  - name: "qwen3.5:27b"
    backend: [ollama]
    size: "17 GB"
    purpose: "Coding, general — best quality that fits in VRAM"
  - name: "qwen3.5:35b-a3b"
    backend: [ollama]
    size: "23 GB"
    purpose: "MoE coding — 3B active, large knowledge base"
  - name: "llama3.2"
    backend: [ollama]
    size: "2.0 GB"
    purpose: "General chat — lightweight"
  - name: "nemotron-3-nano:4b"
    backend: [ollama]
    size: "2.8 GB"
    purpose: "General tasks — lightweight NVIDIA model"
  - name: "nemotron-3-nano:30b"
    backend: [ollama]
    size: "24 GB"
    purpose: "General MoE — 3.5B active, GGUF Q4_K_M via Ollama"
  - name: "nemotron-cascade-2:30b"
    backend: [ollama]
    size: "24 GB"
    purpose: "Reasoning/agentic — 3B active, IMO/IOI 2025 winner"
  - name: "nemotron:70b-instruct-q6_K"
    backend: [ollama]
    size: "58 GB"
    purpose: "Best general quality — dense 70B, near-lossless quant"

  # --- NVFP4 models (vLLM and/or SGLang) ---
  - name: "NVIDIA-Nemotron-Nano-9B-v2-NVFP4"
    backend: [vllm, sglang]
    repo: "nvidia/NVIDIA-Nemotron-Nano-9B-v2-NVFP4"
    size: "7.4 GB"
    purpose: "General/reasoning — Nemotron v2, fast daily driver"
  - name: "nvidia-Qwen3-14B-NVFP4"
    backend: [vllm, sglang]
    repo: "nvidia/Qwen3-14B-NVFP4"
    size: "10 GB"
    purpose: "Coding/general — strong code generation and reasoning"
  - name: "nvidia-Llama-3.1-8B-Instruct-NVFP4"
    backend: [vllm, sglang]
    repo: "nvidia/Llama-3.1-8B-Instruct-NVFP4"
    size: "5.6 GB"
    purpose: "General chat — lightweight, fast instruction following"
  - name: "Qwen3.5-9B-NVFP4"
    backend: [vllm, sglang]
    repo: "ykarout/Qwen3.5-9B-NVFP4"
    size: "8 GB"
    purpose: "Coding, general — Qwen 3.5 9B on Blackwell NVFP4 tensor cores"
  - name: "Qwen3.5-27B-NVFP4"
    backend: [vllm, sglang]
    repo: "apolo13x/Qwen3.5-27B-NVFP4"
    size: "17 GB"
    purpose: "Coding, general — Qwen 3.5 27B on Blackwell NVFP4 tensor cores"
  - name: "Qwen3.5-35B-A3B-NVFP4"
    backend: [vllm, sglang]
    repo: "apolo13x/Qwen3.5-35B-A3B-NVFP4"
    size: "23 GB"
    purpose: "Coding, general — Qwen 3.5 35B MoE (3B active) on Blackwell NVFP4"
