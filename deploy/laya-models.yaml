# laya base checkpoints -- the ONLY catalog for the laya trainer backend.
#
# Hand-written, deliberately NOT part of deploy/models.yaml: every reader of
# that catalog (model-picker, model-fit, model-sync, bench discovery, the
# model-status MCP server) assumes LLM rows, and generate-catalog.py refuses a
# family without an LLM arch_ref. See docs/plans/laya-trainer.md.
#
# Read by:
#   scripts/select-models.py   `make model-pull NAME=<name>` downloads a row into
#                              /var/cache/devai/laya/base/<name>@<revision[:12]>/
#   gpu-arbiter                the trainer backend's model allowlist
#   laya-trainer               base checkpoint verification (baked into the image)
#
# Every row pins a full commit and the sha256 + size of every file, so a
# download can never silently change a student's base. Values checked against
# upstream on 2026-09-24: each LFS file's sha256 equals its LFS oid, and each
# small file's git blob id equals the repo tree's at this revision.
#
# The tokenizer_config.json files at this revision already have the shape
# laya's _fix_tokenizer_config() produces (verified: it leaves them
# byte-identical), so the read-only base needs no fix-up at staging.

schema_version: 1

