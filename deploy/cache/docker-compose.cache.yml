services:
  apt-cache:
    image: sameersbn/apt-cacher-ng:latest
    container_name: devai-apt-cache
    hostname: apt-cache
    ports:
      - "3142:3142"
    volumes:
      - /var/cache/devai/apt:/var/cache/apt-cacher-ng
    restart: unless-stopped

  registry-cache:
    image: registry:2
    container_name: devai-registry-cache
    hostname: registry-cache
    ports:
      - "5000:5000"
    volumes:
      - /var/cache/devai/registry:/var/lib/registry
      - ./registry-config.yml:/etc/docker/registry/config.yml:ro
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: devai-ollama
    hostname: ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=30s
    volumes:
      - /var/cache/devai/ollama:/root/.ollama
    devices:
      - nvidia.com/gpu=all
    security_opt:
      - label=disable
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: devai-open-webui
    hostname: open-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - /var/cache/devai/open-webui:/app/backend/data
    depends_on:
      - ollama
    restart: unless-stopped

networks:
  default:
    name: devai-net
