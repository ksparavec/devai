name: security-advisory

# Advisory-only checks -- never block a merge (continue-on-error: true at
# job level). Findings surface in the Actions tab / Security tab; see
# docs/security-ci.md for how to read them.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both modules consolidated to the current stable Go release
          # (see gpu-arbiter/go.mod, devai-tools/go.mod).
          - module: gpu-arbiter
            go-version: "1.26"
          - module: devai-tools
            go-version: "1.26"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  trivy:
    name: trivy (devai-router image)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build devai-router image
        run: docker build -f deploy/Dockerfile.router -t devai-router:ci .
      - name: Run Trivy
        # v0.29.0's own action.yaml points at a since-deleted
        # aquasecurity/setup-trivy tag (v0.2.2) and fails to resolve;
        # v0.36.0 pins that nested action by hash to the still-live v0.2.6.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devai-router:ci
          exit-code: "0"
          format: table
