name: security-advisory

# Advisory-only checks -- never block a merge (continue-on-error: true at
# job level). Findings surface in the Actions tab / Security tab; see
# docs/security-ci.md for how to read them.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: gpu-arbiter
            go-version: "1.23"
          # devai-tools pins 1.25, not 1.23: cmd/devai-mcp-modelstatus's
          # MCP go-sdk dependency requires go >= 1.25.0 (see go.mod).
          - module: devai-tools
            go-version: "1.25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  trivy:
    name: trivy (devai-router image)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build devai-router image
        run: docker build -f deploy/Dockerfile.router -t devai-router:ci .
      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: devai-router:ci
          exit-code: "0"
          format: table
