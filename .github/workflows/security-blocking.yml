name: security-blocking

# Blocking checks -- these must pass before a PR merges. See
# docs/security-ci.md for the blocking-vs-advisory split and the exact
# branch-protection setup.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        # Pinned release tag -- re-verify the current release at
        # implementation/bump time (github.com/gitleaks/gitleaks/releases).
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --redact -v

  hadolint:
    name: hadolint (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - deploy/Dockerfile.base
          - deploy/Dockerfile.lab
          - deploy/Dockerfile.router
          - deploy/Dockerfile.worker-bootstrap
    steps:
      - uses: actions/checkout@v4
      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          # deploy/*.Dockerfile carry pre-existing warning/info findings
          # (DL3006, DL3008, DL4006, SC2086, SC2015) with no historical
          # cleanup pass yet -- error-only scopes the blocking gate to
          # genuine errors so it doesn't fail unconditionally on every PR.
          failure-threshold: error

  golangci-lint:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both modules consolidated to the current stable Go release
          # (see gpu-arbiter/go.mod, devai-tools/go.mod). install-mode:
          # goinstall compiles golangci-lint locally with each matrix
          # entry's own toolchain instead of using golangci-lint-action's
          # prebuilt binary, which lags upstream Go releases and refuses
          # to lint a go.mod targeting a newer Go version than it was
          # itself built with -- goinstall sidesteps that mismatch for
          # both modules, not just whichever one currently runs ahead.
          - module: gpu-arbiter
            go-version: "1.26"
            install-mode: goinstall
          - module: devai-tools
            go-version: "1.26"
            install-mode: goinstall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ${{ matrix.module }}
          args: --timeout=5m
          install-mode: ${{ matrix.install-mode }}
          # gpu-arbiter predates this workflow and carries pre-existing
          # findings (errcheck/staticcheck) under golangci-lint's defaults;
          # only-new-issues scopes the gate to lines touched by the PR diff
          # so it catches regressions without requiring a historical cleanup
          # pass as a prerequisite. devai-tools is lint-clean from day one.
          only-new-issues: true

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
