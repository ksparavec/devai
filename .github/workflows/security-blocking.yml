name: security-blocking

# Blocking checks -- these must pass before a PR merges. See
# docs/security-ci.md for the blocking-vs-advisory split and the exact
# branch-protection setup.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        # Pinned release tag -- re-verify the current release at
        # implementation/bump time (github.com/gitleaks/gitleaks/releases).
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --redact -v

  hadolint:
    name: hadolint (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - deploy/Dockerfile.base
          - deploy/Dockerfile.lab
          - deploy/Dockerfile.router
          - deploy/Dockerfile.worker-bootstrap
    steps:
      - uses: actions/checkout@v4
      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  golangci-lint:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: gpu-arbiter
            go-version: "1.23"
          # devai-tools pins 1.25, not 1.23: cmd/devai-mcp-modelstatus's
          # MCP go-sdk dependency requires go >= 1.25.0 (see go.mod).
          - module: devai-tools
            go-version: "1.25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: ${{ matrix.module }}
          args: --timeout=5m
          # gpu-arbiter predates this workflow and carries pre-existing
          # findings (errcheck/staticcheck) under golangci-lint's defaults;
          # only-new-issues scopes the gate to lines touched by the PR diff
          # so it catches regressions without requiring a historical cleanup
          # pass as a prerequisite. devai-tools is lint-clean from day one.
          only-new-issues: true

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
